<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <!-- SIGIL LABS - THE SOLOMONIC CIRCUIT OFFICIAL MARK -->
  <!-- 1. OUTER CHIP RING (THE SEAL BOUNDARY) -->
  <circle cx="250" cy="250" r="210" stroke="#FFFFFF" stroke-width="12" />

  <!-- 2. CENTRAL PIERCING SPINE (THE VOLTAGE AXIS) -->
  <line x1="250" y1="60" x2="250" y2="440" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
  <circle cx="250" cy="60" r="10" fill="#FFFFFF" />
  <circle cx="250" cy="440" r="10" fill="#FFFFFF" />

  <!-- 3. UPPER SOLOMONIC ANTENNA LOOPS -->
  <path d="M 170,165 C 170,115 250,115 250,165 C 250,115 330,115 330,165" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" fill="none" />
  <circle cx="170" cy="165" r="14" fill="#FFFFFF" />
  <circle cx="330" cy="165" r="14" fill="#FFFFFF" />

  <!-- 4. LATERAL CIRCUIT BUS LEADS & SOLDER PADS -->
  <line x1="115" y1="250" x2="200" y2="250" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
  <line x1="300" y1="250" x2="385" y2="250" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
  <circle cx="110" cy="250" r="15" fill="#FFFFFF" />
  <circle cx="390" cy="250" r="15" fill="#FFFFFF" />

  <!-- 5. LOWER INVERTED BINDING WINGS -->
  <path d="M 180,345 C 210,385 250,385 250,345 C 250,385 290,385 320,345" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" fill="none" />
  <circle cx="180" cy="345" r="12" fill="#FFFFFF" />
  <circle cx="320" cy="345" r="12" fill="#FFFFFF" />

  <!-- 6. THE CENTRAL QUANTUM OCULAR CORE -->
  <circle cx="250" cy="250" r="50" stroke="#FFFFFF" stroke-width="12" />
  <circle cx="250" cy="250" r="18" fill="#FFFFFF" />
</svg>
